<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Internships · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../css/variables.css" rel="stylesheet">
  <link href="../../css/global.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a class="brand d-block mb-3" href="../../index.html"><span class="brand-mark">I</span>InternConnect</a>
      <div class="sidebar-section-label">Company</div>
      <a class="sidebar-link " href="dashboard.html">Dashboard</a>
<a class="sidebar-link " href="profile.html">Company Profile</a>
<a class="sidebar-link active" href="internships.html">Internships</a>
<a class="sidebar-link " href="create-internship.html">Create Internship</a>
<a class="sidebar-link " href="applicants.html">Applicants</a>
      <div class="sidebar-section-label">Account</div>
      <a class="sidebar-link" href="../public/login.html">Logout</a>
    </div>
  </aside>
  <div class="app-main">
    <header class="dashboard-topbar">
      <button class="icon-button d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('is-open')" aria-label="Open navigation">☰</button>
      <div></div>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
        <span class="small text-muted-custom">Account</span>
      </div>
    </header>
    <main class="dashboard-content">

<div class="page-header"><span class="eyebrow">Company</span><h1>Internships</h1><p>Manage your active, draft and closed opportunities.</p></div>
<div id="list" class="row g-3"><div class="col-12"><div class="loading-skeleton skeleton-lg"></div></div></div>
</main></div></div>

<script src="../../js/api.js"></script>
<script src="../../js/components.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{const t=document.getElementById("list");try{const r=await API.get("/api/company/internships");const a=r.data?.items||[];t.innerHTML=a.length?a.map(x=>`<div class="col-md-6 col-lg-4"><div class="app-card h-100"><div class="d-flex justify-content-between gap-2"><h3>${escapeHTML(x.title)}</h3>${renderStatus(x.status)}</div><p class="small">Applicants: ${escapeHTML(x.applicants_count??0)}</p><p class="small">Deadline: ${escapeHTML(x.deadline||"—")}</p><a class="btn btn-outline-custom" href="applicants.html?id=${encodeURIComponent(x.id)}">View applicants</a></div></div>`).join(""):`<div class="col-12"><div class="empty-state"><h3>No internships</h3><p>Create your first opportunity.</p><a class="btn btn-primary-custom mt-2" href="create-internship.html">Create internship</a></div></div>`}catch(e){t.innerHTML=`<div class="col-12"><div class="alert alert-custom">${escapeHTML(e.message)}</div></div>`}});
</script>
</body>
</html>
