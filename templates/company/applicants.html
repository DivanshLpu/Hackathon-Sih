<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Applicants · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{url_for('static', filename='css/variables.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/global.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/components.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/responsive.css')}}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a class="brand d-block mb-3" href="{{url_for('company')}}"><span class="brand-mark">I</span>InternConnect</a>
      <div class="sidebar-section-label">Company</div>
      <a class="sidebar-link " href="{{url_for('company')}}">Dashboard</a>
<a class="sidebar-link " href="{{url_for('company_profile')}}">Company Profile</a>
<a class="sidebar-link " href="{{url_for('company_internships')}}">Internships</a>
<a class="sidebar-link " href="{{url_for('company_post_internship')}}">Create Internship</a>
<a class="sidebar-link active" href="{{url_for('company_applicants')}}">Applicants</a>
      <div class="sidebar-section-label">Account</div>
      <a class="sidebar-link" href="{{url_for('login')}}">Logout</a>
    </div>
  </aside>
  <div class="app-main">
    <header class="dashboard-topbar">
      <button class="icon-button d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('is-open')" aria-label="Open navigation">☰</button>
      <div></div>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
        <span class="small text-muted-custom">Account</span>
      </div>
    </header>
    <main class="dashboard-content">

<div class="page-header"><span class="eyebrow">Company</span><h1>Applicants</h1><p>Review applicants using transparent skill-match information.</p></div>
<div id="error" class="alert alert-custom d-none"></div>
<div class="app-card table-responsive">
<table class="table align-middle mb-0"><thead><tr><th>Candidate</th><th>College</th><th>Skill Match</th><th>Applied</th><th>Status</th><th></th></tr></thead><tbody id="list"></tbody></table>
</div>
</main></div></div>

<script src="{{url_for('static', filename='js/api.js')}}"></script>
<script src="{{url_for('static', filename='js/components.js')}}"></script>
<script src="{{url_for('static', filename='js/theme.js')}}"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{const id=new URLSearchParams(location.search).get("id"),t=document.getElementById("list"),e=document.getElementById("error");if(!id){e.textContent="Internship ID is missing.";e.classList.remove("d-none");return}try{const r=await API.get("/api/company/internships/"+encodeURIComponent(id)+"/applicants");const a=r.data?.items||[];t.innerHTML=a.length?a.map(x=>`<tr><td>${escapeHTML(x.student?.name)}</td><td>${escapeHTML(x.student?.college||"—")}</td><td><strong>${escapeHTML(x.match?.percentage??0)}%</strong></td><td>${escapeHTML(x.applied_at)}</td><td>${renderStatus(x.status)}</td><td><a class="btn btn-outline-custom btn-sm" href="applicant-profile.html?id=${encodeURIComponent(x.application_id)}">View</a></td></tr>`).join(""):`<tr><td colspan="6" class="text-center text-muted-custom py-5">No applicants found.</td></tr>`}catch(x){e.textContent=x.message;e.classList.remove("d-none")}})
</script>
</body>
</html>
