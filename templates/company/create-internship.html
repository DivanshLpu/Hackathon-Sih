<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Internship · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{url_for('static', filename='css/variables.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/global.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/components.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/responsive.css')}}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a class="brand d-block mb-3" href="{{url_for('company')}}"><span class="brand-mark">I</span>InternConnect</a>
      <div class="sidebar-section-label">Company</div>
      <a class="sidebar-link " href="{{url_for('company')}}">Dashboard</a>
<a class="sidebar-link " href="{{url_for('company_profile')}}">Company Profile</a>
<a class="sidebar-link " href="{{url_for('company_internships')}}">Internships</a>
<a class="sidebar-link active" href="{{url_for('company_post_internship')}}">Create Internship</a>
<a class="sidebar-link " href="{{url_for('company_applicants')}}">Applicants</a>
      <div class="sidebar-section-label">Account</div>
      <a class="sidebar-link" href="{{url_for('login')}}">Logout</a>
    </div>
  </aside>
  <div class="app-main">
    <header class="dashboard-topbar">
      <button class="icon-button d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('is-open')" aria-label="Open navigation">☰</button>
      <div></div>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
        <span class="small text-muted-custom">Account</span>
      </div>
    </header>
    <main class="dashboard-content">

<div class="page-header"><span class="eyebrow">Company</span><h1>Create internship</h1><p>Define the opportunity and the skills required for it.</p></div>
<div id="error" class="alert alert-custom d-none"></div>
<form id="form">
<div class="app-card mb-3"><h3>Opportunity</h3><div class="row g-3 mt-1">
<div class="col-12"><label>Title</label><input name="title" class="form-control" required></div>
<div class="col-12"><label>Description</label><textarea name="description" rows="5" class="form-control" required></textarea></div>
<div class="col-12"><label>Responsibilities</label><textarea name="responsibilities" rows="4" class="form-control" placeholder="One responsibility per line"></textarea></div>
<div class="col-md-4"><label>Location</label><input name="location" class="form-control"></div>
<div class="col-md-4"><label>Work mode</label><select name="work_mode" class="form-select"><option value="remote">Remote</option><option value="hybrid">Hybrid</option><option value="onsite">Onsite</option></select></div>
<div class="col-md-4"><label>Duration</label><input name="duration" class="form-control" placeholder="3 months"></div>
<div class="col-md-4"><label>Stipend</label><input name="stipend" type="number" min="0" class="form-control"></div>
<div class="col-md-4"><label>Openings</label><input name="openings" type="number" min="1" class="form-control"></div>
<div class="col-md-4"><label>Application deadline</label><input name="application_deadline" type="date" class="form-control"></div>
</div></div>
<div class="app-card mb-3"><h3>Skills</h3><p>Add skill IDs returned by <code>GET /api/skills?search=...</code>.</p>
<div class="row g-3"><div class="col-md-6"><label>Required skill IDs</label><input name="required_skills" class="form-control" placeholder="1,2,3"></div><div class="col-md-6"><label>Preferred skill IDs</label><input name="preferred_skills" class="form-control" placeholder="4,5"></div></div>
</div>
<button class="btn btn-primary-custom" type="submit">Publish Internship</button>
</form></main></div></div>

<script src="{{url_for('static', filename='js/api.js')}}"></script>
<script src="{{url_for('static', filename='js/components.js')}}"></script>
<script src="{{url_for('static', filename='js/theme.js')}}"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{const f=document.getElementById("form"),e=document.getElementById("error");f.addEventListener("submit",async ev=>{ev.preventDefault();const body={title:f.title.value.trim(),description:f.description.value.trim(),responsibilities:f.responsibilities.value.split("\n").map(x=>x.trim()).filter(Boolean),location:f.location.value.trim(),work_mode:f.work_mode.value,duration:f.duration.value.trim(),stipend:f.stipend.value?Number(f.stipend.value):null,openings:f.openings.value?Number(f.openings.value):null,application_deadline:f.application_deadline.value,required_skills:f.required_skills.value.split(",").map(x=>x.trim()).filter(Boolean).map(x=>({skill_id:Number(x),is_required:true})),preferred_skills:f.preferred_skills.value.split(",").map(x=>x.trim()).filter(Boolean).map(x=>({skill_id:Number(x)}))};const b=ev.submitter;b.disabled=true;b.textContent="Publishing...";try{const r=await API.post("/api/company/internships",body);window.location.href="internships.html"}catch(x){e.textContent=x.message;e.classList.remove("d-none");b.disabled=false;b.textContent="Publish Internship"}})});
</script>
</body>
</html>
