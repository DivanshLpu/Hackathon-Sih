<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/variables.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/global.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/components.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a class="brand d-block mb-3" href="{{url_for('company')}}"><span class="brand-mark">I</span>{{Title}}</a>
      <div class="sidebar-section-label">Company</div>
      <a class="sidebar-link " href="{{url_for('company')}}">Dashboard</a>
<a class="sidebar-link " href="{{url_for('company_profile')}}">Company Profile</a>
<a class="sidebar-link " href="{{url_for('company_internships')}}">Internships</a>
<a class="sidebar-link " href="{{url_for('company_post_internship')}}">Create Internship</a>
<a class="sidebar-link active" href="{{url_for('company_applicants')}}">Applicants</a>
      <div class="sidebar-section-label">Account</div>
      <a class="sidebar-link" href="{{url_for('login')}}">Logout</a>
    </div>
  </aside>
  <div class="app-main">
    <header class="dashboard-topbar">
      <button class="icon-button d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('is-open')" aria-label="Open navigation">☰</button>
      <div></div>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
        <span class="small text-muted-custom">Account</span>
      </div>
    </header>
    <main class="dashboard-content">

<div id="profile"><div class="loading-skeleton skeleton-lg"></div></div>
</main></div></div>

<script src="{{url_for('static', filename='js/api.js')}}"></script>
<script src="{{url_for('static', filename='js/components.js')}}"></script>
<script src="{{url_for('static', filename='js/theme.js')}}"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{const id=new URLSearchParams(location.search).get("id"),t=document.getElementById("profile");if(!id){t.innerHTML='<div class="alert alert-custom">Application ID is missing.</div>';return}try{const r=await API.get("/api/company/applications/"+encodeURIComponent(id)),d=r.data||{};t.innerHTML=`<div class="page-header"><span class="eyebrow">Applicant</span><h1>${escapeHTML(d.student?.name)}</h1><p>${escapeHTML(d.student?.college)} · ${escapeHTML(d.student?.degree)} · ${escapeHTML(d.student?.branch)}</p></div><div class="row g-3"><div class="col-lg-8"><div class="app-card mb-3"><h3>Profile</h3><p>${escapeHTML(d.student?.bio)}</p><h3>Skills</h3>${renderSkillTags(d.skills||[])}</div><div class="app-card"><h3>Application</h3><p>${escapeHTML(d.application?.cover_letter||"No cover letter.")}</p></div></div><div class="col-lg-4"><div class="app-card mb-3"><h3>Skill Match</h3><div class="display-6 fw-bold">${escapeHTML(d.match?.percentage??0)}%</div><p>${(d.match?.matched_skills||[]).length} matched · ${(d.match?.missing_skills||[]).length} missing</p>${renderSkillTags(d.match?.missing_skills||[])}</div><div class="app-card"><h3>Decision</h3><div class="d-grid gap-2"><button class="btn btn-primary-custom" data-status="shortlisted">Shortlist</button><button class="btn btn-primary-custom" data-status="accepted">Accept</button><button class="btn btn-outline-custom" data-status="rejected">Reject</button></div></div></div></div>`;t.querySelectorAll("[data-status]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await API.put("/api/company/applications/"+id+"/status",{status:b.dataset.status});location.reload()}catch(e){alert(e.message);b.disabled=false}})}catch(e){t.innerHTML=`<div class="alert alert-custom">${escapeHTML(e.message)}</div>`}})
</script>
</body>
</html>
