<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Profile · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../css/variables.css" rel="stylesheet">
  <link href="../../css/global.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a class="brand d-block mb-3" href="../../index.html"><span class="brand-mark">I</span>InternConnect</a>
      <div class="sidebar-section-label">Company</div>
      <a class="sidebar-link " href="dashboard.html">Dashboard</a>
<a class="sidebar-link active" href="profile.html">Company Profile</a>
<a class="sidebar-link " href="internships.html">Internships</a>
<a class="sidebar-link " href="create-internship.html">Create Internship</a>
<a class="sidebar-link " href="applicants.html">Applicants</a>
      <div class="sidebar-section-label">Account</div>
      <a class="sidebar-link" href="../public/login.html">Logout</a>
    </div>
  </aside>
  <div class="app-main">
    <header class="dashboard-topbar">
      <button class="icon-button d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('is-open')" aria-label="Open navigation">☰</button>
      <div></div>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
        <span class="small text-muted-custom">Account</span>
      </div>
    </header>
    <main class="dashboard-content">

<div class="page-header"><span class="eyebrow">Company</span><h1>Company profile</h1><p>Keep your company information current.</p></div>
<div id="error" class="alert alert-custom d-none"></div>
<form id="form" class="app-card">
<div class="row g-3">
<div class="col-md-6"><label>Company name</label><input name="company_name" class="form-control" required></div>
<div class="col-md-6"><label>Industry</label><input name="industry" class="form-control"></div>
<div class="col-12"><label>Description</label><textarea name="description" class="form-control" rows="5"></textarea></div>
<div class="col-md-6"><label>Website</label><input name="website" type="url" class="form-control"></div>
<div class="col-md-6"><label>Location</label><input name="location" class="form-control"></div>
</div><button class="btn btn-primary-custom mt-4">Save changes</button>
</form></main></div></div>

<script src="../../js/api.js"></script>
<script src="../../js/components.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{const f=document.getElementById("form"),e=document.getElementById("error");try{const r=await API.get("/api/company/profile");Object.entries(r.data||{}).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v??""})}catch(x){e.textContent=x.message;e.classList.remove("d-none")}f.addEventListener("submit",async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;b.textContent="Saving...";const body={};["company_name","industry","description","website","location"].forEach(k=>body[k]=f.elements[k].value.trim());try{await API.put("/api/company/profile",body);b.textContent="Saved";setTimeout(()=>{b.textContent="Save changes";b.disabled=false},900)}catch(x){e.textContent=x.message;e.classList.remove("d-none");b.disabled=false;b.textContent="Save changes"}})});
</script>
</body>
</html>
