<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Profile · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../css/variables.css" rel="stylesheet">
  <link href="../../css/global.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a class="brand d-block mb-3" href="../../index.html"><span class="brand-mark">I</span>InternConnect</a>
      <div class="sidebar-section-label">Student</div>
      <a class="sidebar-link " href="dashboard.html">Dashboard</a>
<a class="sidebar-link active" href="profile.html">Profile</a>
<a class="sidebar-link " href="skills.html">Skills</a>
<a class="sidebar-link " href="applications.html">Applications</a>
<a class="sidebar-link " href="resume.html">Resume</a>
<a class="sidebar-link " href="portfolio.html">Portfolio</a>
      <div class="sidebar-section-label">Account</div>
      <a class="sidebar-link" href="../public/login.html">Logout</a>
    </div>
  </aside>
  <div class="app-main">
    <header class="dashboard-topbar">
      <button class="icon-button d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('is-open')" aria-label="Open navigation">☰</button>
      <div></div>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
        <span class="small text-muted-custom">Account</span>
      </div>
    </header>
    <main class="dashboard-content">

<div class="page-header"><span class="eyebrow">Student</span><h1>Profile</h1><p>Keep your academic and professional information current.</p></div>
<div id="profile-error" class="alert alert-custom d-none"></div>
<form id="profile-form">
  <div class="app-card mb-3">
    <h3>Personal information</h3>
    <div class="row g-3 mt-1">
      <div class="col-md-6"><label>First name</label><input name="first_name" class="form-control" required></div>
      <div class="col-md-6"><label>Last name</label><input name="last_name" class="form-control" required></div>
      <div class="col-md-6"><label>Email</label><input name="email" class="form-control" disabled></div>
      <div class="col-md-6"><label>Phone</label><input name="phone" class="form-control"></div>
      <div class="col-md-6"><label>Location</label><input name="location" class="form-control"></div>
      <div class="col-12"><label>Bio</label><textarea name="bio" class="form-control" rows="4"></textarea></div>
    </div>
  </div>
  <div class="app-card mb-3">
    <h3>Education</h3>
    <div class="row g-3 mt-1">
      <div class="col-md-6"><label>College</label><input name="college" class="form-control"></div>
      <div class="col-md-6"><label>Degree</label><input name="degree" class="form-control"></div>
      <div class="col-md-6"><label>Branch</label><input name="branch" class="form-control"></div>
      <div class="col-md-6"><label>Graduation year</label><input name="graduation_year" type="number" class="form-control"></div>
    </div>
  </div>
  <div class="app-card mb-3">
    <h3>Professional links</h3>
    <div class="row g-3 mt-1">
      <div class="col-md-6"><label>GitHub</label><input name="github_url" type="url" class="form-control"></div>
      <div class="col-md-6"><label>LinkedIn</label><input name="linkedin_url" type="url" class="form-control"></div>
    </div>
  </div>
  <button class="btn btn-primary-custom" type="submit">Save changes</button>
</form>
</main></div></div>

<script src="../../js/api.js"></script>
<script src="../../js/components.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
 const form=document.getElementById("profile-form"), err=document.getElementById("profile-error");
 try {
   const r=await API.get("/api/student/profile");
   Object.entries(r.data || {}).forEach(([k,v]) => { if(form.elements[k]) form.elements[k].value=v ?? ""; });
 } catch(e){ err.textContent=e.message; err.classList.remove("d-none"); }
 form.addEventListener("submit", async ev=>{
   ev.preventDefault(); err.classList.add("d-none");
   const body={};
   ["first_name","last_name","phone","college","degree","branch","graduation_year","location","bio","github_url","linkedin_url"].forEach(k=>body[k]=form.elements[k].value.trim());
   const b=ev.submitter; b.disabled=true; b.textContent="Saving...";
   try { await API.put("/api/student/profile",body); b.textContent="Saved"; setTimeout(()=>{b.textContent="Save changes";b.disabled=false;},900); }
   catch(e){ err.textContent=e.message; err.classList.remove("d-none"); b.disabled=false; b.textContent="Save changes"; }
 });
});
</script>
</body>
</html>
