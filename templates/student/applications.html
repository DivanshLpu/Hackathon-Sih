<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{url_for('static', filename='css/variables.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/global.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/components.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/responsive.css')}}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a class="brand d-block mb-3" href="{{url_for('home1')}}"><span class="brand-mark">I</span>{{Title}}</a>
      <div class="sidebar-section-label">Student</div>
      <a class="sidebar-link " href="{{url_for('student')}}">Dashboard</a>
<a class="sidebar-link " href="{{url_for('student_profile')}}">Profile</a>
<a class="sidebar-link " href="{{url_for('student_skills')}}">Skills</a>
<a class="sidebar-link active" href="{{url_for('student_applications')}}">Applications</a>
<a class="sidebar-link " href="{{url_for('student_resume')}}">Resume</a>
<a class="sidebar-link " href="{{url_for('student_portfolio')}}">Portfolio</a>
      <div class="sidebar-section-label">Account</div>
      <a class="sidebar-link" href="{{url_for('login')}}">Logout</a>
    </div>
  </aside>
  <div class="app-main">
    <header class="dashboard-topbar">
      <button class="icon-button d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('is-open')" aria-label="Open navigation">☰</button>
      <div></div>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
        <span class="small text-muted-custom">Account</span>
      </div>
    </header>
    <main class="dashboard-content">

<div class="page-header"><span class="eyebrow">Student</span><h1>Applications</h1><p>Track the opportunities you have applied to.</p></div>
<div class="d-flex flex-wrap gap-2 mb-3" id="status-tabs">
  <button class="btn btn-primary-custom" data-status="">All</button>
  <button class="btn btn-outline-custom" data-status="pending">Pending</button>
  <button class="btn btn-outline-custom" data-status="shortlisted">Shortlisted</button>
  <button class="btn btn-outline-custom" data-status="accepted">Accepted</button>
  <button class="btn btn-outline-custom" data-status="rejected">Rejected</button>
</div>
<div id="applications-error" class="alert alert-custom d-none"></div>
<div class="app-card table-responsive">
<table class="table align-middle mb-0"><thead><tr><th>Internship</th><th>Company</th><th>Match</th><th>Applied</th><th>Status</th></tr></thead><tbody id="application-list"></tbody></table>
</div>
</main></div></div>

<script src="{{url_for('static', filename='js/api.js')}}"></script>
<script src="{{ url_for('static', filename='js/components.js')}}"></script>
<script src="{{ url_for('static', filename='js/theme.js')}}"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{const list=document.getElementById("application-list"),err=document.getElementById("applications-error");let status="";
async function load(){try{const q=status?"?status="+encodeURIComponent(status):"";const r=await API.get("/api/student/applications"+q);const items=r.data?.items||[];list.innerHTML=items.length?items.map(a=>`<tr><td>${escapeHTML(a.internship?.title)}</td><td>${escapeHTML(a.company?.name)}</td><td>${escapeHTML(a.match_percentage ?? "—")}%</td><td>${escapeHTML(a.applied_at)}</td><td>${renderStatus(a.status)}</td></tr>`).join(""):`<tr><td colspan="5" class="text-center text-muted-custom py-5">No applications found.</td></tr>`;}catch(e){err.textContent=e.message;err.classList.remove("d-none")}}
document.querySelectorAll("#status-tabs [data-status]").forEach(b=>b.onclick=()=>{status=b.dataset.status;document.querySelectorAll("#status-tabs button").forEach(x=>x.className="btn btn-outline-custom");b.className="btn btn-primary-custom";load()});load();});
</script>
</body>
</html>
