<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{url_for('static', filename='css/variables.css')}}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/global.css')}}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/components.css')}}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/responsive.css')}}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a class="brand d-block mb-3" href="{{url_for('home1')}}"><span class="brand-mark">I</span>InternConnect</a>
      <div class="sidebar-section-label">Student</div>
      <a class="sidebar-link " href="{{url_for('student')}}">Dashboard</a>
<a class="sidebar-link " href="{{url_for('student_profile')}}">Profile</a>
<a class="sidebar-link " href="skills.html">Skills</a>
<a class="sidebar-link " href="applications.html">Applications</a>
<a class="sidebar-link " href="resume.html">Resume</a>
<a class="sidebar-link active" href="portfolio.html">Portfolio</a>
      <div class="sidebar-section-label">Account</div>
      <a class="sidebar-link" href="../public/login.html">Logout</a>
    </div>
  </aside>
  <div class="app-main">
    <header class="dashboard-topbar">
      <button class="icon-button d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('is-open')" aria-label="Open navigation">☰</button>
      <div></div>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
        <span class="small text-muted-custom">Account</span>
      </div>
    </header>
    <main class="dashboard-content">

<div id="portfolio">
  <div class="page-header"><span class="eyebrow">Student</span><h1>Portfolio</h1><p>Your professional profile and evidence in one place.</p></div>
  <div class="loading-skeleton skeleton-lg"></div>
</div>
</main></div></div>

<script src="{{url_for('static', filename='js/api.js')}}"></script>
<script src="{{ url_for('static', filename='js/components.js')}}"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{const t=document.getElementById("portfolio");try{const r=await API.get("/api/student/portfolio"),d=r.data||{};t.innerHTML=`<div class="app-card mb-3"><h2>${escapeHTML(d.student?.name)}</h2><p>${escapeHTML(d.student?.college)} · ${escapeHTML(d.student?.degree)} · ${escapeHTML(d.student?.branch)}</p><p>${escapeHTML(d.student?.bio)}</p></div><div class="app-card mb-3"><h3>Skills</h3>${renderSkillTags(d.skills||[])}</div><div class="app-card"><h3>Projects</h3>${(d.projects||[]).length?(d.projects||[]).map(x=>`<div class="py-3 border-bottom"><strong>${escapeHTML(x.title)}</strong><p>${escapeHTML(x.description)}</p><a class="text-link" href="${escapeHTML(x.url)}" target="_blank" rel="noopener">View project</a></div>`).join(""):`<p class="mb-0">No projects added yet.</p>`}</div>`}catch(e){t.innerHTML=`<div class="alert alert-custom">${escapeHTML(e.message)}</div>`}});
</script>
</body>
</html>
