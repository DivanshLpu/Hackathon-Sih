<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Skills · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{url_for('static', filename='css/variables.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/global.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/components.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='css/responsive.css')}}" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <a class="brand d-block mb-3" href="{{url_for('home1')}}"><span class="brand-mark">I</span>InternConnect</a>
      <div class="sidebar-section-label">Student</div>
      <a class="sidebar-link " href="{{url_for('student')}}">Dashboard</a>
<a class="sidebar-link " href="{{url_for('student_profile')}}">Profile</a>
<a class="sidebar-link active" href="{{url_for('student_skills')}}">Skills</a>
<a class="sidebar-link " href="{{url_for('student_applications')}}">Applications</a>
<a class="sidebar-link " href="{{url_for('student_resume')}}">Resume</a>
<a class="sidebar-link " href="{{url_for('student_portfolio')}}">Portfolio</a>
      <div class="sidebar-section-label">Account</div>
      <a class="sidebar-link" href="{{url_for('login')}}">Logout</a>
    </div>
  </aside>
  <div class="app-main">
    <header class="dashboard-topbar">
      <button class="icon-button d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('is-open')" aria-label="Open navigation">☰</button>
      <div></div>
      <div class="d-flex align-items-center gap-2">
        <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
        <span class="small text-muted-custom">Account</span>
      </div>
    </header>
    <main class="dashboard-content">

<div class="page-header"><span class="eyebrow">Student</span><h1>My Skills</h1><p>Manage the skills you want employers to see.</p></div>
<div id="skills-error" class="alert alert-custom d-none"></div>
<div class="app-card mb-3">
  <h3>Add a skill</h3>
  <form id="skill-form" class="row g-3 mt-1">
    <div class="col-md-5"><label>Search skill</label><input id="skill-search" class="form-control" placeholder="e.g. Python" autocomplete="off"><input type="hidden" id="skill-id"></div>
    <div class="col-md-3"><label>Proficiency</label><select id="proficiency" class="form-select"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></div>
    <div class="col-md-2"><label>Years</label><input id="years" type="number" min="0" step=".5" class="form-control" value="0"></div>
    <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary-custom w-100">Add</button></div>
  </form>
  <div id="skill-results" class="mt-2"></div>
</div>
<div class="app-card">
  <h3>Current skills</h3>
  <div id="current-skills" class="mt-3"><div class="loading-skeleton" style="height:100px"></div></div>
</div>
</main></div></div>

<script src="{{url_for('static', filename='js/api.js')}}"></script>
<script src="{{ url_for('static', filename='js/components.js')}}"></script>
<script src="{{ url_for('static', filename='js/theme.js')}}"></script>
<script>
document.addEventListener("DOMContentLoaded", async()=>{
 const list=document.getElementById("current-skills"), err=document.getElementById("skills-error"), search=document.getElementById("skill-search"), results=document.getElementById("skill-results"), id=document.getElementById("skill-id");
 async function load(){ try{const r=await API.get("/api/student/skills"); const items=r.data?.skills||[]; list.innerHTML=items.length?items.map(s=>`<div class="d-flex justify-content-between align-items-center py-2 border-bottom"><div><strong>${escapeHTML(s.name)}</strong><div class="small text-muted-custom">${escapeHTML(s.proficiency)} · ${escapeHTML(s.years_experience)} years</div></div><button class="btn btn-outline-custom btn-sm" data-delete="${s.id}">Remove</button></div>`).join(""):`<div class="empty-state"><h3>No skills yet</h3><p>Add your first skill above.</p></div>`; list.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await API.delete("/api/student/skills/"+b.dataset.delete);await load();}catch(e){showErr(e)}});}catch(e){showErr(e)}}
 function showErr(e){err.textContent=e.message;err.classList.remove("d-none")}
 let timer;
 search.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(async()=>{if(search.value.trim().length<2){results.innerHTML="";return;}try{const r=await API.get("/api/skills?search="+encodeURIComponent(search.value.trim()));results.innerHTML=(r.data?.skills||[]).map(s=>`<button type="button" class="btn btn-outline-custom btn-sm me-1 mb-1" data-skill="${s.id}" data-name="${escapeHTML(s.name)}">${escapeHTML(s.name)}</button>`).join("");results.querySelectorAll("[data-skill]").forEach(b=>b.onclick=()=>{id.value=b.dataset.skill;search.value=b.dataset.name;results.innerHTML=""});}catch(e){showErr(e)}},250)});
 document.getElementById("skill-form").addEventListener("submit",async e=>{e.preventDefault();if(!id.value){showErr(new Error("Select a skill from the search results."));return;}try{await API.post("/api/student/skills",{skill_id:Number(id.value),proficiency:document.getElementById("proficiency").value,years_experience:Number(document.getElementById("years").value)});search.value="";id.value="";await load();}catch(x){showErr(x)}});
 await load();
});
</script>
</body>
</html>
