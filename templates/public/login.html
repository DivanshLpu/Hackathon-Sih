<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/variables.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/global.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/components.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
</head>
<body>
<div class="auth-shell"><div class="auth-card">
      <a class="brand d-block mb-4" href="{{ url_for('home1') }}"><span class="brand-mark">I</span>{{Title}}</a>
      <h1 style="font-size:28px">Sign in</h1><p>Access your student or company account.</p>
      <div id="form-error" class="alert alert-custom d-none"></div>
      <form id="login-form">
        <div class="mb-3"><label>Email</label><input name="email" type="email" class="form-control" required></div>
        <div class="mb-3"><label>Password</label><input name="password" type="password" class="form-control" required></div>
        <div class="mb-3"><label>Account type</label><select name="role" class="form-select"><option value="student">Student</option><option value="company">Company</option></select></div>
        <button class="btn btn-primary-custom w-100" type="submit">Login</button>
      </form>
      <div class="small text-center text-muted-custom mt-4">Don't have an account? <a class="text-link" href="{{ url_for('register') }}">Register</a></div>
    </div></div>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/components.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/login.js') }}"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
