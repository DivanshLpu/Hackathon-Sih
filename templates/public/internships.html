<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internships · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/variables.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/global.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/components.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
</head>
<body>
<div id="public-navbar"></div><main>
<div class="container app-container section-padding">
  <div class="page-header"><span class="eyebrow">Opportunities</span><h1>Find internships</h1><p>Search opportunities by skills, location and work mode.</p></div>
  <form id="filter-form" class="filter-panel mb-4">
    <div class="row g-2">
      <div class="col-lg-3"><label>Search</label><input id="search" name="search" class="form-control" placeholder="Python, backend..."></div>
      <div class="col-lg-2"><label>Skill</label><input id="skill" name="skill" class="form-control" placeholder="Flask"></div>
      <div class="col-lg-2"><label>Location</label><input id="location" name="location" class="form-control" placeholder="Bengaluru"></div>
      <div class="col-lg-2"><label>Work mode</label><select id="work_mode" name="work_mode" class="form-select"><option value="">Any</option><option value="remote">Remote</option><option value="hybrid">Hybrid</option><option value="onsite">Onsite</option></select></div>
      <div class="col-lg-2"><label>Sort</label><select id="sort" name="sort" class="form-select"><option value="relevance">Relevance</option><option value="newest">Newest</option><option value="deadline">Deadline</option></select></div>
      <div class="col-lg-1 d-flex align-items-end"><button class="btn btn-primary-custom w-100">Go</button></div>
    </div>
  </form>
  <div id="internship-list" class="row g-3"></div>
  <div id="pagination" class="d-flex justify-content-center gap-2 mt-4"></div>
</div></main><div id="public-footer"></div>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/components.js') }}"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/internships.js') }}"></script>
</body>
</html>
