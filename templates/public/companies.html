<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Companies · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/variables.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/global.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/components.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
</head>
<body>
<div id="public-navbar"></div><main><div class="container app-container section-padding"><div class="page-header"><span class="eyebrow">Industry</span><h1>Companies</h1><p>Explore organizations participating in the platform.</p></div><div id="companies" class="row g-3"><div class="col-12"><div class="loading-skeleton skeleton-lg"></div></div></div></div></main><div id="public-footer"></div>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/components.js') }}"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{renderPublicNavbar("companies");renderFooter();const t=document.getElementById("companies");try{const r=await API.get("/api/companies");const a=r.data?.items||[];t.innerHTML=a.length?a.map(c=>`<div class="col-md-6 col-lg-4"><div class="app-card h-100"><h3>${escapeHTML(c.name)}</h3><div class="company-name mb-2">${escapeHTML(c.industry||"")}</div><p>${escapeHTML(c.description||"")}</p><div class="small text-muted-custom">${escapeHTML(c.location||"")}</div></div></div>`).join(""):`<div class="col-12"><div class="empty-state"><h3>No companies available</h3><p>Company profiles will appear here.</p></div></div>`}catch(e){t.innerHTML=`<div class="col-12"><div class="alert alert-custom">${escapeHTML(e.message)}</div></div>`}});
</script>
</body>
</html>
