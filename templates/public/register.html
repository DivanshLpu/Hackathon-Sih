<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · InternConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../css/variables.css" rel="stylesheet">
  <link href="../../css/global.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="auth-shell"><div class="auth-card">
      <a class="brand d-block mb-4" href="../../index.html"><span class="brand-mark">I</span>InternConnect</a>
      <h1 style="font-size:28px">Create account</h1><p>Start with a simple account. Complete your profile later.</p>
      <div id="form-error" class="alert alert-custom d-none"></div>
      <form id="register-form">
        <div class="mb-3"><label>Account type</label><select id="role" name="role" class="form-select"><option value="student">Student</option><option value="company">Company</option></select></div>
        <div id="student-fields"><div class="row g-3 mb-3"><div class="col-6"><label>First name</label><input name="first_name" class="form-control" required></div><div class="col-6"><label>Last name</label><input name="last_name" class="form-control" required></div></div></div>
        <div id="company-fields" class="d-none"><div class="mb-3"><label>Company name</label><input name="company_name" class="form-control"></div></div>
        <div class="mb-3"><label>Email</label><input name="email" type="email" class="form-control" required></div>
        <div class="mb-3"><label>Password</label><input name="password" type="password" class="form-control" required minlength="8"></div>
        <div class="mb-3"><label>Confirm password</label><input name="confirm_password" type="password" class="form-control" required minlength="8"></div>
        <button class="btn btn-primary-custom w-100" type="submit">Create account</button>
      </form>
      <div class="small text-center text-muted-custom mt-4">Already registered? <a class="text-link" href="login.html">Login</a></div>
    </div></div>
<script src="../../js/api.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/pages/register.js"></script>
</body>
</html>
